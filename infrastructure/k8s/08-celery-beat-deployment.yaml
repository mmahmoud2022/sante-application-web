---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: sante
  labels:
    app: celery-beat
    tier: scheduler
spec:
  replicas: 1  # Must be 1 for beat scheduler
  strategy:
    type: Recreate  # Avoid multiple schedulers
  selector:
    matchLabels:
      app: celery-beat
  template:
    metadata:
      labels:
        app: celery-beat
        tier: scheduler
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: celery-beat
        image: ghcr.io/mmahmoud2022/sante-backend:v1  # Update with your registry
        imagePullPolicy: Always
        command:
        - celery
        - -A
        - app.core.celery_app
        - beat
        - --loglevel=info
        env:
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)"
        - name: REDIS_URL
          value: "redis://redis:6379/0"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: sante-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sante-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: sante-config
              key: POSTGRES_DB
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sante-secrets
              key: SECRET_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
