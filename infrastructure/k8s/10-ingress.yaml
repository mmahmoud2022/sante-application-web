---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sante-ingress
  namespace: sante
  annotations:
    # Traefik is the default ingress controller in k3s
    kubernetes.io/ingress.class: traefik
    # Enable SSL redirect (uncomment when using HTTPS)
    # traefik.ingress.kubernetes.io/redirect-entry-point: https
    # traefik.ingress.kubernetes.io/redirect-permanent: "true"
    # CORS settings
    traefik.ingress.kubernetes.io/custom-response-headers: |
      Access-Control-Allow-Origin:*
      Access-Control-Allow-Methods:GET,POST,PUT,DELETE,OPTIONS
      Access-Control-Allow-Headers:Content-Type,Authorization
spec:
  rules:
  # Frontend route
  - host: sante.local  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  
  # Backend API route
  - host: api.sante.local  # Update with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

---
# Alternative: Single host with path-based routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sante-ingress-single-host
  namespace: sante
  annotations:
    kubernetes.io/ingress.class: traefik
    # Strip prefix for API calls
    traefik.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: sante.local  # Update with your domain
    http:
      paths:
      # Backend API routes (must be first for priority)
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      # Frontend routes (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000

