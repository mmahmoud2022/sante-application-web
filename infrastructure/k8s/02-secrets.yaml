---
apiVersion: v1
kind: Secret
metadata:
  name: sante-secrets
  namespace: sante
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "sante_user"
  POSTGRES_PASSWORD: "sante_password"
  
  # Backend Secret Key (change this in production!)
  SECRET_KEY: "your-super-secret-key-change-in-production-min-32-chars"
  
  # Email Credentials (update with actual values)
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "your-email-password"
  
  # SMS Configuration (update with actual values)
  TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
  TWILIO_AUTH_TOKEN: "your-twilio-auth-token"
  TWILIO_PHONE_NUMBER: "+1234567890"
  
  # Payment Configuration (update with actual values)
  STRIPE_PUBLIC_KEY: "pk_test_your_stripe_public_key"
  STRIPE_SECRET_KEY: "sk_test_your_stripe_secret_key"
  STRIPE_WEBHOOK_SECRET: "whsec_your_webhook_secret"
  
  # AWS Configuration (update with actual values)
  AWS_ACCESS_KEY_ID: "your-aws-access-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-key"
  AWS_REGION: "us-east-1"
  AWS_S3_BUCKET: "sante-uploads"
  
  # OAuth2 Configuration (update with actual values)
  GOOGLE_CLIENT_ID: "your-google-client-id"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  
  # Telemedicine (update with actual values)
  VIDEO_CALL_API_KEY: "your-video-call-api-key"
  VIDEO_CALL_API_SECRET: "your-video-call-api-secret"
