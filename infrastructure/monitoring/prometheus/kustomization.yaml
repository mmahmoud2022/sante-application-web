---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sante

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secrets.yaml
  - 03-pvc.yaml
  - 04-postgres-deployment.yaml
  - 05-redis-deployment.yaml
  - 06-backend-deployment.yaml
  - 07-celery-worker-deployment.yaml
  - 08-celery-beat-deployment.yaml
  - 09-frontend-deployment.yaml
  - 10-ingress.yaml

# Common labels for all resources
commonLabels:
  app.kubernetes.io/name: sante
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

# Common annotations
commonAnnotations:
  description: "Santé Medical Appointment Platform"
